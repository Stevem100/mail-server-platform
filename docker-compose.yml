# Mail Server Platform — single-host deployment (mirrors the design doc's compose stack).
# Only the API and the mail ports face the internet; everything else is internal.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mail
      POSTGRES_USER: mail
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes: ["pg_data:/var/lib/postgresql/data"]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mail"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    networks: [internal]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_KEY:-change-me}
      MINIO_ROOT_PASSWORD: ${S3_SECRET:-change-me-too}
    volumes: ["minio_data:/data"]
    ports: ["127.0.0.1:9001:9001"]   # console on localhost only, per the doc
    networks: [internal]

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    environment: &app_env
      DATABASE_URL: postgresql+psycopg2://mail:${DB_PASSWORD:-change-me}@postgres:5432/mail
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: mail-data
      S3_KEY: ${S3_KEY:-change-me}
      S3_SECRET: ${S3_SECRET:-change-me-too}
      APP_SECRET: ${APP_SECRET:-change-me-app-secret}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.yourplatform.com}
      SERVER_IP: ${SERVER_IP:-203.0.113.10}
      SMTP_RELAY_HOST: ${SMTP_RELAY_HOST:-}
    ports: ["8080:8080"]             # put Caddy/nginx with TLS in front in production
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}
    networks: [internal]

  smtp:
    build: .
    command: python -m app.smtp.server
    environment: *app_env
    ports:
      - "25:25"                      # inbound mail from the world
      - "587:587"                    # authenticated submission
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}
    networks: [internal]

  send-worker:
    build: .
    command: python -m app.workers.send_worker
    environment: *app_env
    depends_on: [api]
    networks: [internal]

  webhook-worker:
    build: .
    command: python -m app.workers.webhook_worker
    environment: *app_env
    depends_on: [api]
    networks: [internal]

  scheduler:
    build: .
    command: python -m app.workers.scheduler
    environment: *app_env
    depends_on: [api]
    networks: [internal]

networks:
  internal: {}

volumes:
  pg_data:
  minio_data:
